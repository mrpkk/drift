[project]
name = "drift"
version = "0.1.0"
description = "Continuous mandate enforcement for AI agents: every action checked against the signed mandate before it happens"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["ai", "agents", "mandate", "authorization", "mcp", "security"]
dependencies = []

[project.urls]
Homepage = "https://github.com/mrpkk/drift"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Каждый модуль должен быть здесь: забытый модуль даёт пакет, который устанавливается,
# но падает на import. Обнаружено установкой вне репозитория.
py-modules = ["drift", "mcp_server", "http_server", "ratelimit", "x402_gate"]
